spring:
  application:
    name: InventoryService
  datasource:
    url: jdbc:mysql://localhost:3306/ZecInventoryDB
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379


server:
  port: 8087

eureka:
  client:
    serviceUrl:
      defaultZone:  http://localhost:8081/eureka/

