spring:
  application:
    name: EmailService

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      properties:
        spring.json.use.type.headers: true
        spring.json.trusted.packages: com.example.EmailService
        spring.json.type.mapping: com.example.AuthService.DTO.RegistrationEmailEvent:com.example.EmailService.RegistrationEmailEvent,com.example.AuthService.DTO.ForgotPassword:com.example.EmailService.ForgotPassword


