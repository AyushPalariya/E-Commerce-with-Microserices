spring:
  application:
    name: EmailService

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: true
        spring.json.trusted.packages: com.example.EmailService
        spring.json.type.mapping:
                                com.example.AuthService.DTO.RegistrationEmailEvent:com.example.EmailService.RegistrationEmailEvent,
                                com.example.AuthService.DTO.ForgotPassword:com.example.EmailService.ForgotPassword,
                                com.example.AuthService.DTO.OtpVerify:com.example.EmailService.OtpVerify,
                                com.example.PaymentService.Dto.ItemDto:com.example.EmailService.ItemDto,
                                com.example.PaymentService.Dto.OrderPlace:com.example.EmailService.OrderPlace,
                                com.example.PaymentService.Dto.OrderPaymentEmail:com.example.EmailService.OrderPaymentEmail




  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ayush.p@zecdata.com}
    password: ${MAIL_PASSWORD:gnvh psqp vtqx sebd}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_TIMEOUT:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:10000}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka/}

kafka:
  topic:
    name: profile
    reset: forgot
    order: orderPlace
    getOtp: sendOtp


server:
  port: ${EMAIL_SERVICE_PORT:8090}