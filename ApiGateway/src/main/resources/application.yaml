spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: AUTH-SERVICE
              uri: lb://AUTHSERVICE
              predicates:
                - Path=/auth/**
            - id: USERSERVICE
              uri: lb://USERSERVICE
              predicates:
                - Path=/user/**
