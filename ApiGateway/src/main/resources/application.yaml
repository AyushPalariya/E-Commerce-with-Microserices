spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: AUTH-SERVICE
              uri: lb://AUTHSERVICE
              predicates:
                - Path=/auth/**
            - id: USER-SERVICE
              uri: lb://USERSERVICE
              predicates:
                - Path=/user/**
            - id: PRODUCT-SERVICE
              uri: lb://PRODUCTSERVICE
              predicates:
                - Path=/products/**
            - id: ORDER-SERVICE
              uri: lb://ORDERSERVICE
              predicates:
                - Path=/order/**
            - id: PAYMENT-SERVICE
              uri: lb://PAYMENTSERVICE
              predicates:
                - Path=/payment/**
            - id: INVENTORY-SERVICE
              uri: lb://INVENTORYSERVICE
              predicates:
                - Path=/inventory/**


security:
  jwt:
    key: ${JWT_KEY:djaijdfnneijrie834382njnefnsdfekwapiwej02393wjnrefejwfnfslaeialewer323nnfioeje33}
    rftAccessible: ${JWT_RFT_ACCESSIBLE:12000}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${API_GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  